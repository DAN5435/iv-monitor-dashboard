<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IV Monitoring Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --ok: #16a34a;
      --alert: #dc2626;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .wrapper {
      width: min(1100px, 100%);
    }

    h1 {
      margin: 0 0 18px 0;
      text-align: center;
      font-size: 1.6rem;
      letter-spacing: 0.4px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(3, minmax(220px, 1fr));
      gap: 16px;
    }

    .box {
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 18px;
      min-height: 170px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 10px;
    }

    .id {
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: #cbd5e1;
    }

    .status {
      font-weight: 700;
      font-size: 1rem;
      padding: 8px 10px;
      border-radius: 8px;
      width: fit-content;
      background: #334155;
    }

    .status.ok { background: rgba(22, 163, 74, 0.2); color: #86efac; }
    .status.alert { background: rgba(220, 38, 38, 0.2); color: #fca5a5; }

    .field-label {
      margin-top: 10px;
      margin-bottom: 5px;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
    }

    .field-input,
    .field-textarea {
      width: 100%;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #0b1222;
      color: var(--text);
      padding: 8px 10px;
      font-size: 0.9rem;
      outline: none;
    }

    .field-input:focus,
    .field-textarea:focus {
      border-color: #60a5fa;
    }

    .field-textarea {
      resize: vertical;
      min-height: 70px;
    }

    .footer {
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }

    .sound-hint {
      margin: 0 0 14px 0;
      text-align: center;
      font-size: 0.85rem;
      color: #fbbf24;
    }

    .sound-hint button {
      margin-left: 8px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #fbbf24;
      background: transparent;
      color: #fbbf24;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .sound-hint button:hover {
      background: rgba(251, 191, 36, 0.15);
    }

    @media (max-width: 840px) {
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>IV Monitoring</h1>
    <p class="sound-hint" id="soundHint">
      Sound alarm when any patient shows LOW IN IV — click once to enable (browser requirement).
      <button type="button" id="enableSoundBtn">Enable alarm sound</button>
    </p>
    <div class="row">
      <article class="box">
        <div>
          <div class="title">Patient 1</div>
          <div class="subtitle">IV-drip</div>
        </div>
        <div class="status" id="status1">Loading...</div>
        <label class="field-label" for="id1">Patient ID</label>
        <input class="field-input" id="id1" type="text" placeholder="Enter patient ID">
        <label class="field-label" for="desc1">Patient Description</label>
        <textarea class="field-textarea" id="desc1" placeholder="Type patient description"></textarea>
      </article>

      <article class="box">
        <div>
          <div class="title">Patient 2</div>
          <div class="subtitle">IV-drip</div>
        </div>
        <div class="status" id="status2">Loading...</div>
        <label class="field-label" for="id2">Patient ID</label>
        <input class="field-input" id="id2" type="text" placeholder="Enter patient ID">
        <label class="field-label" for="desc2">Patient Description</label>
        <textarea class="field-textarea" id="desc2" placeholder="Type patient description"></textarea>
      </article>

      <article class="box">
        <div>
          <div class="title">Patient 3</div>
          <div class="subtitle">IV-drip</div>
        </div>
        <div class="status" id="status3">Loading...</div>
        <label class="field-label" for="id3">Patient ID</label>
        <input class="field-input" id="id3" type="text" placeholder="Enter patient ID">
        <label class="field-label" for="desc3">Patient Description</label>
        <textarea class="field-textarea" id="desc3" placeholder="Type patient description"></textarea>
      </article>
    </div>
    <div class="footer" id="lastUpdate">Waiting for data...</div>
  </div>

  <script>
    // ------------------------------
    // USER SETTINGS
    // ------------------------------
    // Replace with your ThingSpeak channel read API URL:
    // Use fields 1, 2, 3 for patient 1, 2, 3 (one ESP per field).
    // Use feeds.json with results=30+ so we can merge rows: each device
    // creates its own row, so the latest single row may not contain all fields.
    // Increase results= if a patient has not reported in a long time (free tier limits apply).
    const THINGSPEAK_JSON_URL =
      "https://api.thingspeak.com/channels/3362022/feeds.json?api_key=ORXNRWNBY63OSOXU&results=100";

    function bindPersistentField(elementId, storageKey, defaultValue = "") {
      const el = document.getElementById(elementId);
      const saved = localStorage.getItem(storageKey);
      el.value = saved !== null ? saved : defaultValue;
      el.addEventListener("input", () => {
        localStorage.setItem(storageKey, el.value);
      });
    }

    bindPersistentField("id1", "patient1_id", "P1-10001");
    bindPersistentField("id2", "patient2_id", "P2-10002");
    bindPersistentField("id3", "patient3_id", "P3-10003");
    bindPersistentField("desc1", "patient1_desc");
    bindPersistentField("desc2", "patient2_desc");
    bindPersistentField("desc3", "patient3_desc");

    // --- LOW IN IV audible alarm (white noise only; requires user gesture to unlock) ---
    let audioCtx = null;
    let audioUnlocked = false;
    let lastLowIvAlarmAt = 0;
    const LOW_IV_ALARM_REPEAT_MS = 4500;
    let lastMergedSnapshot = { field1: null, field2: null, field3: null };

    function getAudioContext() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) {
          audioCtx = new Ctx();
        }
      }
      return audioCtx;
    }

    async function unlockAlarmAudio() {
      const ctx = getAudioContext();
      if (!ctx) {
        return;
      }
      if (ctx.state === "suspended") {
        await ctx.resume();
      }
      audioUnlocked = true;
      const hint = document.getElementById("soundHint");
      if (hint) {
        hint.style.color = "#86efac";
        hint.innerHTML = "Alarm sound is enabled. You will hear noise when any patient shows LOW IN IV.";
      }
    }

    document.getElementById("enableSoundBtn").addEventListener("click", () => {
      unlockAlarmAudio();
    });
    document.body.addEventListener(
      "click",
      () => {
        unlockAlarmAudio();
      },
      { once: true }
    );

    function playNoiseBurst(ctx, startTime, durationSec, gainValue) {
      const sampleRate = ctx.sampleRate;
      const n = Math.floor(sampleRate * durationSec);
      const buffer = ctx.createBuffer(1, n, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < n; i++) {
        data[i] = (Math.random() * 2 - 1) * 0.85;
      }
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.setValueAtTime(1200, startTime);
      filter.Q.setValueAtTime(0.6, startTime);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, startTime);
      g.gain.exponentialRampToValueAtTime(gainValue, startTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, startTime + durationSec);
      src.connect(filter);
      filter.connect(g);
      g.connect(ctx.destination);
      src.start(startTime);
      src.stop(startTime + durationSec + 0.05);
    }

    function playLowIvAlarmSequence() {
      const ctx = getAudioContext();
      if (!ctx || !audioUnlocked) {
        return;
      }
      const t0 = ctx.currentTime + 0.05;
      playNoiseBurst(ctx, t0, 0.28, 0.13);
      playNoiseBurst(ctx, t0 + 0.3, 0.28, 0.13);
      playNoiseBurst(ctx, t0 + 0.6, 0.28, 0.13);
    }

    function isLowIvValue(raw) {
      return fieldHasValue(raw) && Number(raw) === 0;
    }

    function maybeAlarmLowIv(anyLowIv) {
      if (!anyLowIv || !audioUnlocked) {
        return;
      }
      const now = Date.now();
      if (now - lastLowIvAlarmAt < LOW_IV_ALARM_REPEAT_MS) {
        return;
      }
      lastLowIvAlarmAt = now;
      try {
        playLowIvAlarmSequence();
      } catch (e) {
        /* ignore */
      }
    }

    function fieldHasValue(v) {
      return v !== null && v !== undefined && String(v).trim() !== "";
    }

    // Newest row first: take the latest non-empty value per field across recent feeds.
    function mergeLatestByField(feeds) {
      const out = { field1: null, field2: null, field3: null };
      if (!Array.isArray(feeds) || feeds.length === 0) {
        return out;
      }
      for (let i = feeds.length - 1; i >= 0; i--) {
        const row = feeds[i];
        if (!fieldHasValue(out.field1) && fieldHasValue(row.field1)) {
          out.field1 = row.field1;
        }
        if (!fieldHasValue(out.field2) && fieldHasValue(row.field2)) {
          out.field2 = row.field2;
        }
        if (!fieldHasValue(out.field3) && fieldHasValue(row.field3)) {
          out.field3 = row.field3;
        }
        if (
          fieldHasValue(out.field1) &&
          fieldHasValue(out.field2) &&
          fieldHasValue(out.field3)
        ) {
          break;
        }
      }
      return out;
    }

    function renderStatus(elementId, rawValue) {
      const el = document.getElementById(elementId);
      if (!fieldHasValue(rawValue)) {
        el.textContent = "No Data";
        el.className = "status";
        return;
      }
      const value = Number(rawValue);

      // Mapping based on your sensor definition:
      // 1 => Have IV
      // 0 => Low in IV
      if (value === 1) {
        el.textContent = "HAVE IV";
        el.className = "status ok";
      } else if (value === 0) {
        el.textContent = "LOW IN IV";
        el.className = "status alert";
      } else {
        el.textContent = "No Data";
        el.className = "status";
      }
    }

    async function fetchData() {
      try {
        const response = await fetch(THINGSPEAK_JSON_URL, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const data = await response.json();
        const feeds = Array.isArray(data.feeds) ? data.feeds : [];
        const merged = mergeLatestByField(feeds);
        lastMergedSnapshot = merged;

        renderStatus("status1", merged.field1);
        renderStatus("status2", merged.field2);
        renderStatus("status3", merged.field3);

        const anyLowIv =
          isLowIvValue(merged.field1) ||
          isLowIvValue(merged.field2) ||
          isLowIvValue(merged.field3);
        maybeAlarmLowIv(anyLowIv);

        const now = new Date().toLocaleString();
        document.getElementById("lastUpdate").textContent = `Last refresh: ${now}`;
      } catch (err) {
        document.getElementById("lastUpdate").textContent =
          `Error loading ThingSpeak data (${err.message}). Check channel ID/API key/privacy settings.`;
      }
    }

    // Initial fetch and periodic updates
    fetchData();
    setInterval(fetchData, 15000);

    // Repeat alarm while LOW IN IV (not only on each ThingSpeak poll).
    setInterval(() => {
      const m = lastMergedSnapshot;
      const anyLowIv =
        isLowIvValue(m.field1) ||
        isLowIvValue(m.field2) ||
        isLowIvValue(m.field3);
      maybeAlarmLowIv(anyLowIv);
    }, 3000);
  </script>
</body>
</html>
